<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка подписей калькулятора</title><style>body{font:16px Arial;background:#eee}iframe{width:320px;height:850px;border:0;display:block}button{padding:12px}pre{white-space:pre-wrap}</style><p>Сценарий регрессии: 320 px, цена 9 999,99 ₽, скидка 50%, сбор 13%. Выберите эти значения в форме ниже.</p><button id="check">Проверить подписи</button><pre id="result">Выберите параметры в калькуляторе и запустите проверку.</pre><iframe title="Калькулятор 320 px" src="../hopinn-hotels/#terms"></iframe><script>
document.querySelector('#check').onclick=async()=>{const d=document.querySelector('iframe').contentDocument;await d.fonts.ready;const boxes=[...d.querySelectorAll('#terms .component-copy')].map(e=>e.getBoundingClientRect());const gaps=[boxes[1].top-boxes[0].bottom,boxes[2].top-boxes[1].bottom];const width=d.documentElement.clientWidth;document.querySelector('#result').textContent=JSON.stringify({pass:gaps.every(g=>g>=8)&&d.documentElement.scrollWidth===width,width,gaps,price:d.querySelector('#calc-price').value,discount:d.querySelector('#calc-discount').value,fee:d.querySelector('#calc-fee').value});};
</script></html>
